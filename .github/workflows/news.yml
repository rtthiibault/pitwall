name: Paddock Wire (actualités F1)

on:
  schedule:
    - cron: '23 * * * *'   # chaque heure ; le script ne relève que si le dernier relevé a 5 h ou plus
  workflow_dispatch:
    inputs:
      force:
        description: 'Relever tout de suite, même si le dernier relevé a moins de 5 h'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Relever et analyser les dépêches
        run: node scripts/update-news.mjs
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
      - name: Commit si nouveau relevé
        run: |
          git config user.name "pitwall-bot"
          git config user.email "pitwall-bot@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "Pas de relevé"; exit 0; fi
          git commit -m "Paddock Wire : relevé $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
