name: Mise à jour hebdomadaire des données F1

on:
  schedule:
    # Lundi et mardi matin (UTC), après chaque Grand Prix
    - cron: '17 6 * * 1,2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données
        run: node scripts/update-data.mjs
      - name: Commit si changement
        run: |
          git config user.name "pitwall-bot"
          git config user.email "pitwall-bot@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "Données F1 : mise à jour $(date -u +%F)"
          git push
