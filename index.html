  <script>
    /* Mise à jour automatique : au chargement, au retour sur l'onglet et toutes les 2 minutes, la page compare sa version
       à celle en ligne (version.txt, sans cache). Plus récente : rechargement avec une URL neuve, jamais pendant une course
       ou une fenêtre ouverte (on réessaie plus tard). */
    (function () {
      var BUILD = '202611261255', busy = false;
      function check() {
        if (busy) return; busy = true;
        fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
          busy = false; v = (v || '').trim();
          if (!v || v === BUILD) return;
          var m = document.getElementById('modal');
          if (m && m.children.length) return; // course ou fenêtre ouverte : on attend
          var k = 'pitwall:reloaded:' + v;
          try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
          var u = new URL(location.href); u.searchParams.set('v', v); location.replace(u.toString());
        }).catch(function () { busy = false; });
      }
      check();
      setInterval(function () { if (!document.hidden) check(); }, 120000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
      window.addEventListener('focus', check);
    })();
  </script>
